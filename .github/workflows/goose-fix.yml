name: Goose Auto Bug Fixer (Groq)

on:
  issues:
    types: [labeled]

jobs:
  goose-agent:
    if: github.event.label.name == 'this'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Goose CLI
        run: |
          echo "Downloading latest Goose binary..."
          curl -fsSL https://github.com/aaif-goose/goose/releases/latest/download/goose-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv goose /usr/local/bin/
          goose --version

      # Langkah 4: Menjalankan Goose Agent dengan Groq Cloud
      - name: Run Goose Agent
        env:
          # PERBAIKAN: Mengalihkan provider dari Google ke Groq Cloud
          GOOSE_PROVIDER: groq
          GOOSE_MODEL: qwen-2.5-coder-32b
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE='${{ github.event.issue.title }}'
          ISSUE_BODY='${{ github.event.issue.body }}'
          
          echo "Starting Goose investigation for Issue: $ISSUE_TITLE"
          
          # Instruksi tembak langsung ke file target
          goose run --text "Your task is to resolve the following GitHub issue. Issue Title: $ISSUE_TITLE. Detailed Description: $ISSUE_BODY. Mandatory workflow: 1. Go straight to Src/UI/WPR.UI.Android/WPR.UI.Android.csproj. Do not scan other folders. 2. Edit that csproj file: change <RuntimeIdentifiers> to only include android-arm64;android-x64 (remove android-arm). 3. Immediately use Git tools to create a new branch named 'feature/arm64-build', commit your changes, push to origin, and open a Pull Request to the main/master branch. Do not run any tests."

      # Langkah 5: Komentar Otomatis Jika Sukses
      - name: Comment on Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "🤖 **Goose has successfully fixed the bug via Groq!** I have analyzed the issue, repaired the code in the background, and automatically created a new Pull Request (PR) for your review. Please check the Pull Requests tab."

