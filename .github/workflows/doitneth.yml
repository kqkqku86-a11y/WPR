name: Build WPR Android ARMv7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore Src/UI/WPR.UI.Android/WPR.UI.Android.csproj

      - name: Publish ARMv7 APK
        run: |
          dotnet publish \
          Src/UI/WPR.UI.Android/WPR.UI.Android.csproj \
          -c Release \
          -f net8.0-android34.0 \
          -r android-arm

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WPR-ARMv7
          path: |
            **/*.apk
