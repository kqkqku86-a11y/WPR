name: Build WPR Android ARMv7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'

      - name: Show .NET info
        run: dotnet --info

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: |
          dotnet restore \
          Src/UI/WPR.UI.Android/WPR.UI.Android.csproj \
          -p:TargetFramework=net8.0-android34.0

      - name: Build ARMv7 APK
        run: |
          dotnet publish \
          Src/UI/WPR.UI.Android/WPR.UI.Android.csproj \
          -c Release \
          -f net8.0-android34.0 \
          -p:RuntimeIdentifier=android-arm \
          -p:AndroidPackageFormat=apk \
          --self-contained false

      - name: Find APK
        run: find . -iname "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WPR-ARMv7
          path: |
            **/*.apk
